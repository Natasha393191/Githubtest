<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳本 - 簡單記帳管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 頂部導航 -->
    <header class="header">
        <div class="container">
            <h1 class="logo">💰 記帳本</h1>
            <nav class="nav">
                <a href="#" class="nav-link active" data-tab="home">首頁</a>
                <a href="#" class="nav-link" data-tab="add">記帳</a>
                <a href="#" class="nav-link" data-tab="history">歷史</a>
                <a href="#" class="nav-link" data-tab="stats">統計</a>
            </nav>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="main">
        <!-- 首頁 -->
        <section id="home" class="tab-content active">
            <div class="container">
                <!-- 餘額卡片 -->
                <div class="balance-card">
                    <h2>總餘額</h2>
                    <div class="balance-amount" id="totalBalance">NT$ 0</div>
                    <div class="balance-details">
                        <div class="balance-item income">
                            <span class="label">收入</span>
                            <span class="amount" id="totalIncome">NT$ 0</span>
                        </div>
                        <div class="balance-item expense">
                            <span class="label">支出</span>
                            <span class="amount" id="totalExpense">NT$ 0</span>
                        </div>
                    </div>
                </div>

                <!-- 快速操作 -->
                <div class="quick-actions">
                    <button class="quick-btn income-btn" onclick="showAddForm('income')">
                        <span class="icon">💰</span>
                        <span class="text">收入</span>
                    </button>
                    <button class="quick-btn expense-btn" onclick="showAddForm('expense')">
                        <span class="icon">💸</span>
                        <span class="text">支出</span>
                    </button>
                </div>

                <!-- 最近交易 -->
                <div class="recent-transactions">
                    <h3>最近交易</h3>
                    <div id="recentList" class="transaction-list">
                        <!-- 交易記錄將在這裡顯示 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 記帳頁面 -->
        <section id="add" class="tab-content">
            <div class="container">
                <div class="add-form-container">
                    <h2>新增交易</h2>
                    
                    <!-- 類型選擇 -->
                    <div class="type-selector">
                        <button class="type-btn active" data-type="expense">支出</button>
                        <button class="type-btn" data-type="income">收入</button>
                    </div>

                    <!-- 表單 -->
                    <form id="transactionForm" class="transaction-form">
                        <div class="form-group">
                            <label for="amount">金額</label>
                            <input type="number" id="amount" name="amount" placeholder="請輸入金額" required>
                        </div>

                        <div class="form-group">
                            <label for="category">分類</label>
                            <select id="category" name="category" required>
                                <option value="">請選擇分類</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="description">備註</label>
                            <input type="text" id="description" name="description" placeholder="備註說明（選填）">
                        </div>

                        <div class="form-group">
                            <label for="date">日期</label>
                            <input type="date" id="date" name="date" required>
                        </div>

                        <button type="submit" class="submit-btn">新增交易</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- 歷史記錄頁面 -->
        <section id="history" class="tab-content">
            <div class="container">
                <h2>交易歷史</h2>
                
                <!-- 篩選器 -->
                <div class="filter-section">
                    <select id="monthFilter" class="filter-select">
                        <option value="">所有月份</option>
                    </select>
                    <select id="categoryFilter" class="filter-select">
                        <option value="">所有分類</option>
                    </select>
                    <select id="typeFilter" class="filter-select">
                        <option value="">收入+支出</option>
                        <option value="income">僅收入</option>
                        <option value="expense">僅支出</option>
                    </select>
                </div>

                <!-- 交易列表 -->
                <div id="historyList" class="transaction-list">
                    <!-- 歷史記錄將在這裡顯示 -->
                </div>
            </div>
        </section>

        <!-- 統計頁面 -->
        <section id="stats" class="tab-content">
            <div class="container">
                <h2>統計分析</h2>
                
                <!-- 月度統計 -->
                <div class="stats-card">
                    <h3>本月統計</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">收入</span>
                            <span class="stat-value income" id="monthIncome">NT$ 0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">支出</span>
                            <span class="stat-value expense" id="monthExpense">NT$ 0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">結餘</span>
                            <span class="stat-value" id="monthBalance">NT$ 0</span>
                        </div>
                    </div>
                </div>

                <!-- 分類統計 -->
                <div class="category-stats">
                    <h3>支出分類統計</h3>
                    <div id="categoryChart" class="chart-container">
                        <!-- 分類統計圖表將在這裡顯示 -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
